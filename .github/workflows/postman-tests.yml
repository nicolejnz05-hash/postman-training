name: Postman API Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install Newman
      run: npm install -g newman
    - name: Run Postman Collection
      run: newman run ./postman/collections/ExternalAPIs.postman_collection.json -e  ./postman/environments/Staging.postman_environment.json
