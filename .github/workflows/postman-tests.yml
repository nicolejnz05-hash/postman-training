name: Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Check Postman files
        run: |
          echo "=== Repository files ==="
          find postman -type f -print

      - name: Run Postman Collection
        run: |
          mkdir -p reports

          COLLECTION=$(find postman -type f -name "*postman_collection.json" -print -quit)
          ENVIRONMENT=$(find postman -type f -name "*postman_environment.json" -print -quit)

          echo "Collection: $COLLECTION"
          echo "Environment: $ENVIRONMENT"

          if [ -z "$COLLECTION" ]; then
            echo "Collection file not found."
            exit 1
          fi

          if [ -z "$ENVIRONMENT" ]; then
            echo "Environment file not found."
            exit 1
          fi

          echo "=== Verifying files ==="
          ls -lb "$COLLECTION"
          ls -lb "$ENVIRONMENT"

          echo "=== Running Newman ==="

          newman run "$COLLECTION" \
            -e "$ENVIRONMENT" \
            -r cli,htmlextra \
            --reporter-htmlextra-export "./reports/newman-report.html"

      - name: Create fallback report if Newman failed
        if: always()
        run: |
          if [ ! -f "./reports/newman-report.html" ]; then
            cat > "./reports/newman-report.html" <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Newman Test Report</title>
          </head>
          <body>
            <h1>Newman Test Report</h1>
            <h2>Newman execution failed</h2>
            <p>Newman did not generate an HTML report.</p>
            <p>Please check the GitHub Actions logs for the Newman execution error.</p>
          </body>
          </html>
          EOF
          fi

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-report
          path: ./reports/newman-report.html
