name: Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Check Postman files
        run: |
          echo "=== Repository files ==="
          find postman -type f -print

      - name: Run Postman Collection
        continue-on-error: true
        run: |
          mkdir -p reports

          COLLECTION=$(find postman/collections -type f -name "*.json" | head -n 1)
          ENVIRONMENT=$(find postman/environments -type f -name "*.json" | head -n 1)

          echo "Collection: $COLLECTION"
          echo "Environment: $ENVIRONMENT"

          if [ -z "$COLLECTION" ] || [ -z "$ENVIRONMENT" ]; then
            echo "Postman collection or environment file was not found."

            cat > reports/newman-report.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Newman Test Report</title>
          </head>
          <body>
            <h1>Newman Test Report</h1>
            <h2>Execution Error</h2>
            <p>Postman collection or environment file could not be found by GitHub Actions.</p>
          </body>
          </html>
          EOF

            exit 1
          fi

          newman run "$COLLECTION" \
            -e "$ENVIRONMENT" \
            -r cli,htmlextra \
            --reporter-htmlextra-export "./reports/newman-report.html"

      - name: Create fallback report if Newman failed
        if: always()
        run: |
          if [ ! -f "./reports/newman-report.html" ]; then
            cat > ./reports/newman-report.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Newman Test Report</title>
          </head>
          <body>
            <h1>Newman Test Report</h1>
            <h2>Newman execution failed</h2>
            <p>The Newman test execution did not generate an HTML report.</p>
            <p>Please check the GitHub Actions logs for the execution error.</p>
          </body>
          </html>
          EOF
          fi

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-report
          path: ./reports/newman-report.html
